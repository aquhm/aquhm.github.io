          * Command 패턴 기반 하이브리드 데이터 통신 설계 (Remote API / 로컬 캐시 Fallback)
          * Kafka, REST API로 수신한 시설물 상태·알림 정보를 3D 공간에 실시간 시각화
          * UniTask 비동기 처리와 UniRx 반응형 프로그래밍으로 API 수신 데이터 처리·UI 반영 고도화
