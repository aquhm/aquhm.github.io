          * 멀티 사이트 구성·빌드 자동화 에디터 도구(Service Builder) 개발 — 사이트 분기 로직을 ScriptableObject 설정 에셋으로 외부화하고, 매니저 배치·데이터 베이크·system.ini·사이트별 빌드를 버튼 한 번으로 일괄 수행
