  - title: Projects
    layout: list
    content:
      - layout: left
        title: 디지털 트윈 건물 관제 시스템
        sub_title: 건물 시뮬레이션 및 실시간 관제 SI 프로젝트
        caption: 2025.08 - 재직중
        quote: |
          개발환경: Unity, C#, JSON, REST API, Kafka, Git, Notion, Visual Studio, Rider, Claude Code<br>
          플랫폼: Windows<br>
          개발규모: 전체 10~12인 중 클라이언트 4~6인
        description: |
          <br>건물 내외부를 디지털 트윈으로 구현하여 실시간 모니터링 및 관제할 수 있는 시스템을 개발하고 있습니다. 대규모 데이터 시각화와 실시간 API 연동이 핵심인 프로젝트로, 백엔드 개발 상황이나 네트워크 환경에 구속받지 않고 안정적인 개발 및 시연이 가능한 데이터 통신 아키텍처를 구축하는 데 주력했습니다. 또한, Visual Scripting 도구를 활용하여 Presenter Layer 로직 구현 속도를 높이고 유지보수 효율성을 높였습니다.

          **하이브리드 데이터 통신 시스템 설계**
          * REST API 통신 로직을 Command 패턴으로 추상화하여, 데이터 소스(Remote API vs Local File)에 관계없이 동일한 인터페이스로 기능을 실행할 수 있도록 설계
          * 백엔드 통신 불가 상황(서버 점검, 오프라인 시연 등)을 대비하여, 실시간 통신 시 획득한 JSON 데이터를 로컬 시스템에 캐싱하고 필요 시 호출하는 Fallback 메커니즘 구현
          * 별도의 JSON Config 파일 내 프로퍼티 설정에 따라 실시간 통신 모드와 캐시 데이터 모드를 동적으로 전환할 수 있는 기능을 구현하여 시연 및 테스트 안정성 확보

          **Visual Scripting을 통한 개발 생산성 향상**
          * Visual Scripting SDK(GameCreator)를 활용한 UI 연동 로직을 컴포넌트화
          * 반복적인 UI 상호작용 및 로직을 Instruction Command 기반으로 작업하여 코드 복잡도를 낮추고, 프로토타이핑 및 기능 수정 작업의 효율 향상
          * Visual Scripting 변수 생성 및 타입별 Get/Set 접근 코드를 자동 생성하는 코드 제너레이터를 구현, 문자열 키를 직접 다루던 접근 방식을 정적 API로 대체하여 문자열 오타로 인한 런타임 오류와 수작업 동기화 비용을 제거하고, IDE 자동완성·컴파일 타임 검증을 확보해 스크립트에서의 비주얼 스크립팅 연동 작업 효율 향상

          **디지털 트윈 데이터 연동 및 시각화**
          * 건물 내 시설물 상태 정보 및 각종 알림 정보를 Kafka, REST API를 통해 수신하여 3D 공간 내에 실시간으로 시각화
          * 각종 수신 데이터를 효율적으로 처리하고 UI에 반영하기 위한 비동기 처리(UniTask) 및 Reactive Programming(UniRx)으로 개선

          **멀티 사이트 운영을 위한 통합 빌드/구성 자동화 툴(Service Builder) 설계 및 개발**
          * 사업(사이트)마다 달라지는 기능·데이터·서버 엔드포인트·빌드 설정을 단일 ScriptableObject 설정 에셋으로 외부화하여, 사이트 추가 시 코드 수정 없이 설정만으로 대응 가능한 구조 확립
          * 서버 엔드포인트를 Play용·빌드용 프로파일로 분리 관리하고, 씬 목록(GUID)·제품명·빌드 옵션·git SHA 기록을 포함한 사이트별 빌드 파이프라인 자동화(CLI 진입점으로 CI 연동)
          * 씬 구성, 베이크, 환경설정, 사이트별 컨텐츠 노출 등 사이트 구성에 필요한 과정을 단일 버튼으로 수행하는 일괄 적용 기능 제공

          **주요 성과:**
          * Command 패턴 기반의 백엔드 개발 의존성 분리를 통해 네트워크 환경과 무관한 독립적인 시연 및 테스트 환경 구축
          * 사업(사이트)별 분기를 설정 에셋(데이터)으로 외부화하여, 신규 현장 추가 시 코드 수정 없이 설정만으로 대응 가능한 구조 확보
          * 국내 대형 전자 제조사의 건물 3개 사이트를 디지털 트윈으로 구축해 실시간 관제에 적용


      - layout: left
        title: Soma
        sub_title: WebRTC 기반 3D 아바타 가상 오피스
        caption: 2021.04 - 2024.11
        quote: |
          개발환경: Unity, C#, Typescript, Electron, Python, Objective-C(iOS/macOS 플러그인), WebRTC(Agora SDK), REST API, WebSocket, Jira, ClickUp, Slack<br>
          플랫폼: Windows, macOS, Android, iOS<br>
          개발규모: 전체 8~15인 중 클라이언트 2~5인
        description: |
          <br>프로젝트 초기부터 합류하여 Unity Engine을 활용하여 재택근무 시 활용할 수 있는 메타버스 아바타 3D 기반의 화상 통화(WebRTC) 가상 오피스 서비스를 작업하였습니다. Window, MacOS, Android, iOS 4개 PC/mobile 플랫폼을 지원하기 때문에 관련 macOS/ iOS의 경우에는 Objective-C로 native 플러그인 작업을 진행하였습니다. 그리고 PC의 경우 Launcher로 구동하는 구조여서 Electron framework와 typescript로 유지보수도 병행하였습니다. 재택을 도입하는 여러 업체를 대상으로 유료화 런칭 서비스하였습니다. REST API와 웹 소켓 통신으로 시스템과 콘텐츠에 따라 구분하여 처리되어 있습니다. 직접 개발한 프로젝트로 회사 업무도 진행하였기에 직원들의 VOC, feedback을 빠르게 수집 및 대응할 수 있었습니다. 초기부터 런칭까지 작업 및 기여했던 프로젝트로 기존 게임적인 value뿐만 아니라 업무에 필요한 서비스적인 value와 가치도 융합하여 다양한 방식으로 생각하고 경험하게 되었습니다.

          **커뮤니케이션 시스템 구축(Agora SDK 활용)**
          * Agora SDK를 기반으로 미디어 디바이스 목록 관리, 변경 이벤트 처리, 화면 공유 기능을 UniRx 기반 반응형 아키텍처로 구현
          * Barracuda ONNX Model 정보를 활용해 얼굴 인식 기능 연동
          * 수신하는 영상 RGBA Byte 정보를 메모리 풀링 기법 관리. 메모리 오버헤드를 최소화 및 GC 부담 줄이도록 구현

          **아키텍처 설계 및 프레임워크 개발**
          * 서비스 지향 아키텍처로 도메인 로직과 프레젠테이션 로직을 명확히 분리되도록 구성. 도메인별 로직을 서비스 캡슐화로 관심사 분리되도록 프로젝트 프레임워크 구성
          * MVP 아키텍처를 적용한 제네릭 기반의 Presenter 구조를 통해 UI 생명주기를 관리하고, UniRx를 활용한 이벤트 기반 아키텍처로 UI 상태 전환을 관리하는 UI 프레임워크 설계
          * UniTask 기반 REST API 비동기 처리. 타임아웃, 에러 핸들링, 재시도 메커니즘 구현 및 데이터 전송 시나리오(JSON, 멀티파트 폼, 파일 업로드)를 처리
          * 전략 패턴과 팩토리 패턴을 결합한 인터페이스를 설계하여, 패킷 타입별 등록 관리 및 동적으로 라우팅하는 시스템을 구축. 기능 추가시 코드 수정을 최소화 및 확장이 용이하도록 구성
          * 템플릿 메소드와 전략 패턴을 활용한 확장 가능한 로깅 아키텍처를 설계 RESTful API와 비동기 처리를 통해 이벤트 기반 구조로 다양한 사용자 인터렉션(앱 사용, 화면 전환, UI 조작)을 체계적으로 추적 및 데이터 기반 UX 개선에 기여

          **다수의 콘텐츠 및 UI/UX 개발**
          * 재사용 가능한 UI 요소들을 캡슐화 및 프리팹화한 UI KIT를 에디터에 통합 및 구성하여 디자인의 일관성을 유지 및 UI 개발 시간을 단축되도록 구성
          * 상태 패턴 활용하여 다양한 공유 타입(카메라, 화면, 이미지, 유튜브, 협업 보드)을 지원하는 크로스 플랫폼 화면 공유 시스템을 설계 및 새로운 공유 모드 추가 시 기존 코드 수정 없이 확장 가능한 구조를 구현
          * 로그인, 로비, 접속자, 대시보드, 집중모드, 그룹창, 인벤토리, 메뉴, 네비게이션, 온보딩, 채팅, 화면공유, 시스템 메시지, 팀관리 다수의 콘텐츠 작업
          * DOTween을 활용한 UI연출처리 담당

          **크로스 플랫폼 지원**
          * macOS, Windows 네이티브 플러그인 제작하여 OS 알림 시스템 구현 및 연동. (macOS Bundle, Windows DLL)
          * 웹캠, 마이크 등 하드웨어 디바이스의 유무와 접근 권한을 플랫폼별로 대응 처리하여 다양한 환경에서 안정적인 동작을 보장

          **최적화 및 기타 기능 구현**
          * 웹 크롤링과 벤치마크 데이터를 활용한 디바이스 성능 평가 시스템을 구현. 데스크톱 GPU, 안드로이드, iOS 기기별로 최소 사양 충족 여부를 판단하는 로직으로 플랫폼별 그래픽 품질 설정으로 일관된 사용자 경험 제공
          * 효율적인 리소스 관리를 위한 로컬 캐시 파일 시스템을 구현. 각종 이미지 캐시 데이터 관리하여 MD5 해시 기반 중복 파일 제거, 만료된 캐시 자동 정리를 구현하여 네트워크 트래픽 감소, 앱 성능 향상 및 오프라인 사용성을 개선

          **주요 성과:**
          * 재택 근무를 도입하려는 다수의 기업 고객 확보를 통한 유료 서비스 런칭 성공
          * 실사용자 피드백을 기반으로 기능을 개선하고 서비스에 반영
          * 멀티 플랫폼 지원을 통한 폭넓은 접근성 확보

          **프로젝트 회고**
          &nbsp;Soma 프로젝트는 기획 단계부터 런칭까지 참여한 의미 있는 경험이었습니다. 코로나19 팬데믹으로 인한 원격 근무 환경에서 시작된 이 프로젝트는 3D 아바타 기반의 영상 통화를 융합하여 새로운 가상 업무 공간을 제공하는 것이었습니다.    
          개발 초기에는 게임 엔진을 활용한 업무용 서비스 구현이라는 독특한 접근 방식에 대한 의구심이 있었습니다. 그러나 회사 내부 직원들을 첫 번째 사용자로 삼아 실제 업무 환경에서 지속적으로 테스트하고 피드백을 수집함으로써, 게임적 요소(아바타 조작, 인터렉션)와 업무 기능(화면 공유, 화상 회의)을 효과적으로 융합할 수 있었습니다.          
          특히 Windows, macOS, Android, iOS 등 다양한 플랫폼에서 일관된 사용자 경험을 사용성의 폭과 함께 실시간성을 높였습니다. 각 OS별 네이티브 기능(권한 관리, 알림 시스템, 하드웨어 접근)을 통합하는 과정에서 플랫폼 특화 지식을 크게 확장할 수 있었습니다.         
          초기 사용자였던 회사 직원들의 지속적인 피드백이 제품의 품질과 사용성 향상에 결정적인 역할을 했습니다. 결과적으로 Soma 프로젝트는 기술적 도전을 넘어, 새로운 형태의 원격 근무 솔루션을 시장에 성공적으로 소개한 의미 있는 여정이었습니다.
          이 경험을 통해 게임 개발 기술을 다양한 비즈니스 솔루션에 창의적으로 적용할 수 있는 역량을 키울 수 있었습니다.
        
      - layout: left
        title: 직방 3D 단지 투어
        sub_title: Data Driven 방식의 아파트 단지 시뮬레이션
        caption: 2020.11 - 2021.04
        quote: |
          개발환경: Unity, C#, Visual Studio Code, REST API, Github, Jira, Slack<br>
          플랫폼: Android, iOS<br>
          개발규모: 전체 6인 중 클라이언트 3~4인
        description: | # this will include new lines to allow paragraphs
          <br>React Native 기반 직방 앱에 Unity Engine을 연동하여 아파트 단지를 3D로 시뮬레이션하는 서비스를 개발했습니다. 런칭 3개월 전 합류하여 주로 사용자 경험 개선과 서비스 안정화에 주력했습니다.

          **UI/UX 개발 및 연출 작업**
          * UGUI 기반 전체 UI 시스템 개선 및 연출 작업
          * REST API를 통해 수신한 Metadata정보 시각화 및 UX 구현
          * 로컬 캐시 정보를 활용하여 사용자 온보딩을 위한 튜토리얼 기능 구현

          **성능 최적화**
          * 건물 객체의 활용되는 Material 정보를 Pooling으로 관리하여 객체 생성 시 지연을 최소화 및 메모리 최적화
          * 아파트 단지 다수의 주변 건물 3D Object Culling 처리를 통한 최적화 구현

          **주요 성과:**
          * 직관적인 UI/UX 설계를 통한 서비스 완성도 향상
          * 효율적인 리소스 관리로 모바일 환경에서의 성능 최적화 달성
          * 실제 매물 정보와 3D 시뮬레이션의 성공적인 통합 구현

          **프로젝트 회고**
          &nbsp;건물 객체의 Material Pooling과 주변 건물 Culling으로 생성 지연과 렌더링 부담을 낮춰 모바일 환경을 최적화했습니다.
          
      - layout: left
        title: ProjectR
        sub_title: SLG장르 모바일 전략 시뮬레이션 게임
        caption: 2018.01 - 2020.10
        quote: |
          개발환경: Unity, C#, Visual Studio, REST API, GitHub, Jira, Slack<br>
          플랫폼: Android, iOS<br>
          개발규모: 전체 25~30인 중 클라이언트 6인
        description: | # this will include new lines to allow paragraphs
          <br>모바일 전략 시뮬레이션 프로젝트의 초기 개발부터 소프트 런칭까지 참여하여 데이터 기반 시스템과 다양한 클라이언트 기능을 개발했습니다. MVC 및 이벤트 기반 아키텍처를 적용하여 비즈니스 로직과 UI를 분리하고, 반복적인 개발 및 테스트 작업을 효율화하기 위한 Editor 기반 개발 도구와 데이터 검증 도구를 구축했습니다.

          **데이터 기반 시스템 및 상태 관리 아키텍처**
          * 이벤트 기반 아키텍처를 적용하여 데이터와 비즈니스 로직, UI를 분리하고 기능별 상태 및 객체 생명주기를 체계적으로 관리
          * XML 기반 데이터를 활용하여 다양한 객체의 생성, 상태 변경, 레벨 변화 및 소멸 등의 생명주기를 관리하는 시스템 구현
          * XML 기반 스킬·성장·자원·아이템·연맹 관련 데이터를 활용한 클라이언트 기능 개발

          **개발 및 테스트 도구 구축**
          * Unity EditorWindow 기반의 개발·테스트 도구를 제작하여 테스트 환경 설정과 반복 작업을 간소화
          * Excel 기반 기획 데이터를 XML로 변환하는 Serialize 도구를 유지보수하고 VBA Macro를 활용하여 Excel과 개발 도구 간 데이터 연동 작업을 자동화
          * XML 데이터 무결성 검증 모듈을 구현하여 빌드 전 데이터 오류를 사전 검증하고 런타임 오류 발생 가능성을 감소시킴

          **콘텐츠 시스템 개발**
          * 데이터 기반의 연구, 재능, 연맹 연구, 스킬 트리 등 다양한 성장 콘텐츠 개발
          * 이벤트 기반 아키텍처를 활용하여 군주·영웅·병사·소환수 등의 성장 시스템과 객체 생명주기 구현
          * 월드 맵 이동·전투·정찰, 인벤토리·상점·아이템 강화, 연맹 및 가속 아이템 등 다양한 콘텐츠 시스템 개발

          **주요 성과:**
          * 이벤트 기반 아키텍처를 적용하여 데이터와 비즈니스 로직, UI를 분리하고 기능 확장성과 유지보수성을 확보
          * 개발·테스트 도구와 데이터 검증 기능을 구축하여 반복적인 작업과 테스트 과정의 효율성 향상
          * 데이터 기반 구조를 통해 신규 기능 및 콘텐츠 추가에 유연하게 대응할 수 있는 클라이언트 시스템 구축
          * 프로젝트 초기 개발부터 소프트 런칭까지 클라이언트 기능 개발에 참여

          **프로젝트 회고**
          &nbsp;이 프로젝트는 개발 중 초기 기획에서 완전히 방향성이 변경되는 상황을 경험했습니다. 이러한 변화에 유연하게 대응하면서도 모바일 전략 시뮬레이션 게임의 핵심 시스템을 효과적으로 구현했습니다.  
          데이터 주도적 설계를 적용하여 복잡한 스킬 시스템과 성장 시스템을 구축했으며, 특히 다양한 효과가 중첩되는 환경에서 확장성 있는 아키텍처를 설계하는 경험이 가장 유의미했습니다.  
          개발 효율성 향상을 위해 Excel 기획 데이터의 XML 변환과 검증 도구를 유지보수하고 Unity Editor 테스트 도구를 구축했습니다. 초기 개발부터 소프트 런칭까지 데이터 기반 콘텐츠 구조와 클라이언트 기능 개발에 참여했습니다.

      - layout: left
        title: 이카루스 온라인
        sub_title: PC 3D MMORPG 게임
        caption: 2015.10 - 2018.01
        quote: |
          개발환경: CryEngine3, C++, WinAPI, STL, Visual Studio, ActionScript 3.0, Scaleform 4.0, Mantis, SVN<br>
          플랫폼: Windows<br>
          개발규모: 전체 70~75인 중 클라이언트 6~8인
        description: |
          <br>기존 온라인 게임의 북미 서비스 프로젝트에 참여하여 Nexon America 플랫폼 연동, 클라이언트 시스템 개발, 대규모 파일 패치 시스템 구축, UI/UX 개선 및 서비스 안정화 업무를 담당했습니다. 특히 멀티스레드 기반의 대용량 파일 처리와 네트워크 오류 대응 등 안정적인 클라이언트 서비스 운영을 위한 시스템 개발에 참여했습니다.

          **대용량 파일 패치 시스템 설계 및 개발**
          * 멀티스레드 기반 Custom Patcher를 설계·구현하여 대규모 파일의 병렬 다운로드, 압축 해제 및 무결성 검증을 처리
          * 약 9만여 개의 파일을 대상으로 패치 데이터를 효율적으로 처리하고, 병렬 처리하여 대규모 패치 환경에 대응
          * gzip 압축 해제 및 파일 무결성 검증 로직을 구현하여 패치 과정에서 발생할 수 있는 데이터 오류를 사전에 검증
          * Nexon 패치 SDK와 연동하여 JSON 기반 패치 상태 정보를 전송하고 다운로드 및 적용 진행 상황을 관리

          **외부 플랫폼 및 시스템 연동**
          * Nexon America 플랫폼과 클라이언트 간 연동 기능을 개발하고 북미 서비스 환경에 맞는 클라이언트 기능 구현
          * 국가별 서비스 환경과 요구사항에 맞춰 기존 클라이언트 시스템을 확장하고 기능을 적용

          **네트워크 오류 대응 및 서비스 안정화**
          * 네트워크 불안정으로 인한 소켓 연결 오류 발생 시 서비스 상태를 확인하고 재접속할 수 있도록 예외 처리 및 상태 복구 로직 구현
          * 로비 서버와 게임 서버 간 재진입 과정을 개선하여 네트워크 오류 발생 이후 사용자의 서비스 복귀 시간을 단축
          * 대용량 패치 과정에서 발생하는 파일 크기 제한 및 비정상 패치 문제를 분석하고, 일정 크기 단위로 파일을 분할 처리하는 방식으로 패치 시스템 안정화

          **클라이언트 기능 및 UI/UX 개발**
          * 사용자 인터랙션과 서비스 요구사항에 맞춘 다양한 클라이언트 기능 및 UI/UX 개발
          * 기존 시스템의 UI/UX를 개선하고 신규 기능 추가에 필요한 클라이언트 구조 및 화면 개발
          * CPU·GPU 벤치마크 데이터를 활용하여 사용자 디바이스 성능을 평가하고, 시스템 사양에 따라 그래픽 품질을 자동 설정하는 기능 구현
          * 주요 구현: 액션 모드(크로스헤어·퀵슬롯·타겟 유지), UI 크기 조절·저사양 모드, 퀘스트 네비게이션, 3:3 PvP 전장·유물 쟁탈전·용병단 PvE 콘텐츠

          **로컬라이징 및 데이터 관리 시스템**
          * Excel Automation Library를 활용하여 서비스 텍스트를 관리하는 데이터 처리 시스템 개발
          * 국가 및 서비스 환경에 따라 텍스트와 이미지 리소스를 자동으로 변경할 수 있는 로컬라이징 시스템 구현
          * 반복적인 로컬라이징 작업을 자동화하여 서비스 지역별 리소스 적용 및 유지보수 효율 향상

          **주요 성과:**
          * 멀티스레드·병렬 처리 기반의 대용량 파일 패치 시스템을 구축하여 대규모 패치 데이터의 안정적인 배포 환경 구현
          * 파일 무결성 검증 및 네트워크 오류 복구 기능을 통해 클라이언트 서비스 안정성 향상
          * Nexon America 플랫폼 연동 및 북미 서비스 환경에 맞춘 클라이언트 기능 개발을 통해 해외 서비스 런칭에 기여
          * 디바이스 성능 측정 및 자동 그래픽 설정 기능을 구현하여 다양한 사용자 환경에서의 서비스 품질 개선
          * 로컬라이징 데이터 처리 및 리소스 적용 과정을 자동화하여 반복적인 운영 작업의 효율성 향상

          **프로젝트 회고**
          &nbsp;이카루스 온라인의 북미 런칭 TF팀에 합류하여 글로벌 서비스 준비 과정에서 중요한 역할을 수행했습니다. 본 프로젝트에서 가장 가치 있었던 경험은 Nexon America의 플랫폼 연동을 통한 북미 서비스 런칭이었습니다.          
          특히, 다중 스레드 기반의 Custom Patcher를 개발하여 Nexon Launcher와 성공적으로 연동했으며, CryPack 파일 분할 패치 시스템을 구현함으로써 대용량 패치 과정에서 발생하던 비정상 현상을 효과적으로 해결했습니다. 이는 패치 안정성을 크게 향상시켜 사용자 경험을 개선하는 데 기여했습니다.          
          또한 네트워크 단절 시 기존 로비 재진입 방식에서 서버 간 직접 리커넥팅 시스템으로 개선하여 로딩 시간을 단축 및 사용자 경험을 향상시켰습니다. 이러한 기술적 개선과 함께 북미 사용자들의 피드백을 반영한 UI/UX 개선으로 현지 시장 적응력을 강화했습니다.          
          Nexon America와의 지속적인 협업 과정에서 글로벌 서비스 개발에 대한 깊은 이해를 얻게 되었습니다. 결과적으로 기존 국내 서비스보다 향상된 시스템을 구축하여 성공적인 북미 런칭을 달성했습니다.
      
      - layout: left
        title: 아이리스온라인
        sub_title: PC 3D MMORPG 게임
        caption: 2009.09 - 2011.05
        quote: |
          개발환경: C++, WinAPI, STL, Visual Studio, MFC, GameBryo, Perforce<br>
          플랫폼: Windows<br>
          개발규모: 전체 25~30인 중 클라이언트 4~5인
        description: |
          <br>서비스 런칭 3개월 전 합류하여 상용화 및 러시아 진출을 위한 현지화 업무를 담당했습니다. 외부 SNS 서비스 연동, 사용자 및 콘텐츠 관련 기능 개발, 클라이언트·서버·DB 연계 개발 등을 수행했으며, 러시아 서비스 런칭 이후 패치 및 유지보수 업무를 진행했습니다.

          **외부 SNS 서비스 연동**
          * Twitcurl 라이브러리를 활용하여 Twitter 기능을 클라이언트에 연동
          * 게임 내 Twitter 로그인/로그아웃, 타임라인 조회, 트윗 작성, 리트윗, 팔로우 기능 구현
          * 게임 이벤트와 연동하여 Twitter 자동 알림 기능 구현

          **사용자 및 콘텐츠 기능 개발**
          * 파티·길드·친구 등 사용자 간 커뮤니티 기능 개발 및 개선
          * 캐시 아이템 기능과 외형 변경, 탈것 기능 구현
          * 콘텐츠 단위의 서버·클라이언트·DB(MSSQL Stored Procedure) 연계 개발

          **글로벌 서비스 대응**
          * 러시아 서비스 진출을 위한 클라이언트 현지화 및 런칭 업무 수행
          * 국가별 서비스에 필요한 패치 및 유지보수 업무 수행

          **주요 성과:**
          * Twitter API 및 Twitcurl 라이브러리를 활용한 외부 서비스 연동 기능 구현
          * 콘텐츠 단위의 서버·클라이언트·DB 연계 개발 경험 확보
          * 러시아 서비스 현지화 및 런칭, 이후 패치 및 유지보수 수행

          **프로젝트 회고**
          &nbsp;아이리스 온라인 프로젝트는 상용 서비스 직전 단계와 해외 진출 과정에 참여한 귀중한 경험이었습니다. 특히 Twitter API 연동 작업이 가장 흥미롭고 의미 있는 업무였습니다. OAuth 인증 방식과 REST API 활용을 통해 게임 내에서 소셜 기능을 구현하는 과정에서 웹 서비스 연동에 대한 실질적인 경험을 얻을 수 있었습니다.  
          또한 초기 클라이언트 개발에서 시작하여 점차 서버와 데이터베이스 작업까지 담당하게 되면서, MMORPG의 전체 시스템 아키텍처를 이해하고 능력을 기를 수 있었습니다. 글로벌 서비스를 위한 현지화 과정에서는 다국어 지원을 고려한 개발의 중요성을 체득했습니다.  
          이 프로젝트를 통해 게임 서비스의 전 주기에 걸친 이해와 함께, 다양한 기술 스택을 활용한 풀스택 개발 역량을 쌓을 수 있었습니다.

