<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.name }}<small>{{ site.title }}</small></a>
    <nav aria-label="주요 메뉴">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>이력</a>
      <a href="{{ '/portfolio/' | relative_url }}"{% if page.url contains '/portfolio' %} aria-current="page"{% endif %}>프로젝트</a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <div class="actions">
      <a class="btn btn-docs" href="{{ '/#docs' | relative_url }}">PDF 문서</a>
      <a class="btn primary" href="mailto:{{ site.email }}">연락하기</a>
      <button class="btn theme" type="button" data-theme-toggle aria-label="다크 모드 전환"><span aria-hidden="true">◐</span></button>
    </div>
  </div>
</header>
