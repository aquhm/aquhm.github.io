<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.name | escape }}</title>
  {%- seo title=false -%}
  <script>
    // 저장된 테마를 첫 페인트 전에 적용해 깜빡임을 막는다.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- if site.favicon %}
  <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | relative_url }}">
  {%- endif %}
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
{% include site-nav.html %}
<main id="main">
{{ content }}
</main>
{% include site-footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- for script in page.scripts %}
<script src="{{ script | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- endfor %}
</body>
</html>
