<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.name | escape }}</title>
  {%- seo title=false -%}

  <link rel="stylesheet" href="{{ '/assets/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- if site.favicon %}
  <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | relative_url }}">
  {%- endif %}
</head>
<body class="portfolio-page">
{% include site-nav.html %}

{{ content }}

{% include site-footer.html %}
{%- for script in page.scripts %}
<script src="{{ script | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- endfor %}
</body>
</html>
